name: Generate Debug Version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - trigger-debug-build

permissions:
  contents: read
  issues: write

concurrency:
  group: debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Verify local runtime native libraries
        if: steps.gradle_build.outcome == 'success'
        run: python3 scripts/check_local_runtime_apk.py app/build/outputs/apk/debug/*.apk

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-build-log-${{ github.run_id }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve existing build failure issues on success
        if: steps.gradle_build.outcome == 'success'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            try {
              const source = context.payload.pull_request
                ? `PR #${context.payload.pull_request.number}`
                : (context.eventName === 'workflow_dispatch' ? `Manual dispatch on \`${context.ref}\`` : `ref \`${context.ref}\``);
              const title = `Build failure: ${source}`;
              const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
              const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              for (const issue of data.items) {
                if (issue.title === title) {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: issue.number,
                    body: `✅ **Resolved:** Build succeeded on commit \`${context.sha}\` (run [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})). Closing issue.`
                  });
                  await github.rest.issues.update({
                    ...context.repo,
                    issue_number: issue.number,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  console.log(`Closed issue #${issue.number} as resolved`);
                }
              }
            } catch (err) {
              if (err.status === 410 || (err.message && err.message.includes('Issues has been disabled'))) {
                console.warn('GitHub Issues are disabled in repository settings. Enable Issues under Settings > Features to enable automated issue tracking.');
              } else {
                console.error('Error in issue resolution step:', err);
              }
            }

      - name: Report build failure as an issue
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          BUILD_LOG: gradle-build.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.BUILD_LOG)
              ? fs.readFileSync(process.env.BUILD_LOG, 'utf8')
              : 'Gradle did not produce a build log.';
            const maxLogLength = 45000;
            const excerpt = log.length > maxLogLength
              ? `[Earlier output omitted; full log is attached to the workflow run.]\n${log.slice(-maxLogLength)}`
              : log;
            const source = context.payload.pull_request
              ? `PR #${context.payload.pull_request.number}`
              : (context.eventName === 'workflow_dispatch' ? `Manual dispatch on \`${context.ref}\`` : `ref \`${context.ref}\``);
            const title = `Build failure: ${source}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### 🚨 Automated Debug Build Failure Report',
              '',
              `- **Trigger:** ${context.eventName}`,
              `- **Source:** ${source}`,
              `- **Commit:** \`${context.sha}\``,
              `- **Workflow run:** [${context.runId}](${runUrl})`,
              '- **Full log:** download the `gradle-build-log` artifact from the workflow run.',
              '',
              '---',
              '',
              '### Gradle Error Output',
              '<details open><summary>Click to view/collapse</summary>',
              '',
              '```text',
              excerpt,
              '```',
              '</details>',
              '',
              '---',
              '*This issue will be automatically closed when a subsequent build succeeds on this ref/branch.*'
            ].join('\n');

            try {
              const { data: matches } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
                per_page: 10
              });
              const existing = matches.items.find(issue => issue.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body: `🔄 Build failure repeated on commit \`${context.sha}\`:\n\n${body}`
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                  labels: ['build-failure', 'bug']
                });
              }
            } catch (err) {
              if (err.status === 410 || (err.message && err.message.includes('Issues has been disabled'))) {
                console.warn('⚠️ GitHub Issues are disabled for this repository in Repository Settings. Enable "Issues" under Settings -> General -> Features to create tracking issues.');
              } else {
                console.error('Error reporting build failure issue:', err);
              }
            }

      - name: Fail workflow after reporting
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload Debug APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
