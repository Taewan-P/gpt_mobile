name: Remote diagnostics

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      task:
        description: Diagnostic task to run
        required: true
        default: all
        type: choice
        options: [all, resources, test, lint, build]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: remote-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    name: Resource and XML preflight
    if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == 'resources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android resources
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate.sh resources 2>&1 | tee resource-check.log
      - name: Write summary
        if: always()
        run: |
          {
            echo '## Android resource preflight'
            if [[ '${{ steps.check.outcome }}' == 'success' ]]; then
              echo '✅ XML is well formed and no resources are duplicated within a values configuration.'
            else
              echo '❌ Resource preflight failed. Relevant output:'
              echo '```text'
              tail -n 80 resource-check.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-diagnostics-${{ github.run_id }}
          path: resource-check.log
          retention-days: 14
          if-no-files-found: warn
      - name: Fail after reporting
        if: steps.check.outcome == 'failure'
        run: exit 1

  gradle:
    name: ${{ matrix.label }}
    if: github.event_name == 'pull_request' || inputs.task != 'resources'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: test
            label: Unit tests
          - task: lint
            label: Android lint
          - task: build
            label: Debug build
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - name: Accept Android licenses
        if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Grant Gradle wrapper permission
        if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task
        run: chmod +x gradlew
      - name: Run ${{ matrix.label }}
        if: github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate.sh '${{ matrix.task }}' 2>&1 | tee '${{ matrix.task }}.log'
      - name: Write concise summary
        if: always() && (github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task)
        shell: bash
        run: |
          {
            echo '## ${{ matrix.label }}'
            if [[ '${{ steps.validation.outcome }}' == 'success' ]]; then
              echo '✅ Passed.'
            else
              echo '❌ Failed. Last 100 log lines:'
              echo '```text'
              tail -n 100 '${{ matrix.task }}.log'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic log
        if: always() && (github.event_name == 'pull_request' || inputs.task == 'all' || inputs.task == matrix.task)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-diagnostics-${{ github.run_id }}
          path: ${{ matrix.task }}.log
          retention-days: 14
          if-no-files-found: warn
      - name: Fail after reporting
        if: steps.validation.outcome == 'failure'
        run: exit 1

  report:
    name: PR diagnostic report
    if: always() && github.event_name == 'pull_request'
    needs: [resources, gradle]
    runs-on: ubuntu-latest
    steps:
      - name: Add or update PR report
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- remote-diagnostics -->';
            const results = {
              'Resource/XML preflight': '${{ needs.resources.result }}',
              'Gradle diagnostics': '${{ needs.gradle.result }}'
            };
            const icon = value => value === 'success' ? '✅' : value === 'skipped' ? '⏭️' : '❌';
            const body = [
              marker,
              '## Remote CI diagnostics',
              '',
              ...Object.entries(results).map(([name, value]) => `- ${icon(value)} **${name}:** ${value}`),
              '',
              `Details, concise summaries, and sanitized log artifacts: [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              '',
              `_Commit: \`${context.sha}\`_`
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
