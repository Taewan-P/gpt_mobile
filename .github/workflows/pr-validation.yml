name: PR Validation

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Android regex compatibility
        run: python3 scripts/check_android_regex.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle Problem Matcher
        run: echo "::add-matcher::.github/gradle-problem-matcher.json"
        continue-on-error: true

      - name: Run Unit Tests & JaCoCo Coverage Report
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:jacocoTestReport --no-daemon --info 2>&1 | tee test.log || (echo "=== TEST FAILURE LOG ===" && tail -n 100 test.log && exit 1)

      - name: Verify exported Room schemas
        if: always()
        run: python3 scripts/check_room_schemas.py

      - name: Run Android Lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --info 2>&1 | tee lint.log || (echo "=== LINT FAILURE LOG ===" && tail -n 100 lint.log && exit 1)

      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          check_name: "Unit Test Results"
          fail_on_failure: false
          require_tests: false

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore

      - name: Generate PR Step Summary
        if: always()
        run: |
          echo "## CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test.log ]; then
            TEST_FAILURES=$(grep -E "(FAILURE|FAILED|There were failing tests)" test.log || true)
            if [ -n "$TEST_FAILURES" ]; then
              echo "### ❌ Unit Test Warnings / Failures" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$TEST_FAILURES" | tail -n 20 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Unit Tests Succeeded" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -f lint.log ]; then
            LINT_ERRORS=$(grep -E "(Error:|Fatal error:|errors occurred:)" lint.log || true)
            if [ -n "$LINT_ERRORS" ]; then
              echo "### ⚠️ Lint Findings" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$LINT_ERRORS" | tail -n 20 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Android Lint Succeeded" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          if [ -d "app/build/reports/jacoco/jacocoTestReport" ]; then
            echo "### 📊 JaCoCo Code Coverage Report Generated" >> $GITHUB_STEP_SUMMARY
          fi
