name: Publish Signed Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  validate:
    name: Validate exact release commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release version before building
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import re; print(re.search(r"versionName = \"([^\"]+)\"", open("app/build.gradle.kts").read()).group(1))')
          TAG="v$VERSION"
          PRE=false
          if [[ "$GITHUB_REF_NAME" != main && "$GITHUB_REF_NAME" != master ]]; then TAG="$TAG-pre.${GITHUB_SHA:0:7}"; PRE=true; fi
          RECOVERY='Update versionName and increment versionCode in app/build.gradle.kts, commit the change, then start a new Publish Signed Release run on the updated branch. Re-running this failed run uses the original commit.'
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error title=Release version already used::$TAG points to $TAG_SHA, but this run builds $GITHUB_SHA. $RECOVERY"
              exit 1
            fi
          fi
          # Fail on API/authentication errors instead of treating them as an unused version.
          if ! RELEASE_TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'); then
            echo '::error title=Release lookup failed::Could not verify existing releases. Check GitHub API access before publishing.'
            exit 1
          fi
          if grep -Fxq -- "$TAG" <<< "$RELEASE_TAGS"; then
            echo "::error title=Release already exists::$TAG already has a release; its assets will not be replaced. $RECOVERY"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Validated unused release $TAG for commit $GITHUB_SHA"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - name: Unit tests, compatibility, resources and lint
        run: |
          set -euo pipefail
          python3 scripts/check_android_resources.py
          # Room/KSP exports schemas to a shared directory. Keep debug and release
          # KSP work in separate Gradle invocations so variants cannot read a
          # partially-written schema from each other.
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
          ./gradlew :app:checkReleaseAarMetadata :app:lintRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
  build:
    needs: validate
    name: Build, verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/setup_release_keystore.sh
      - name: Build release artifacts
        run: |
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          rm -rf app/build/intermediates/shrunk_resources_proto_format/release/minifyReleaseWithR8
          ./gradlew :app:bundleRelease -PenableAbiSplits=false --no-daemon --max-workers=2
      - name: Sign and verify APKs and bundle
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir -p release-artifacts
          while IFS= read -r apk; do
            NAME=$(basename "$apk")
            DEST="release-artifacts/${NAME/-unsigned/}"
            "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$DEST" "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$DEST"
          done < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort)
          test -n "$(find release-artifacts -name '*.apk' -print -quit)"
          python3 scripts/check_local_runtime_apk.py release-artifacts/*.apk
          cp app/build/outputs/bundle/release/*.aab release-artifacts/app-release.aab
          jarsigner -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 release-artifacts/app-release.aab "$KEY_ALIAS"
          jarsigner -verify release-artifacts/app-release.aab
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            mkdir previous-release
            gh release download --pattern '*arm64-v8a*.apk' --dir previous-release
            PREVIOUS=$(find previous-release -name '*.apk' -print -quit)
            test -n "$PREVIOUS" || { echo 'Set RELEASE_CERT_SHA256 for a first release'; exit 1; }
            EXPECTED_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$PREVIOUS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          fi
          EXPECTED_CERT_SHA256=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]')
          for apk in release-artifacts/*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "${ACTUAL,,}" = "${EXPECTED_CERT_SHA256,,}" || { echo 'Signing certificate continuity check failed'; exit 1; }
          done
          BUNDLE_CERT=$(keytool -printcert -jarfile release-artifacts/app-release.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':')
          test "${BUNDLE_CERT,,}" = "${EXPECTED_CERT_SHA256,,}" || { echo 'Bundle certificate continuity check failed'; exit 1; }
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool.jar" python3 scripts/verify_release_identity.py release-artifacts "$GITHUB_SHA"
          (cd release-artifacts && sha256sum *.apk *.aab provenance.json > SHA256SUMS.txt)
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: 'release-artifacts/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == true ]]; then FLAGS+=(--prerelease); fi
          NOTES=()
          if [[ -f RELEASE_NOTES.md ]]; then NOTES+=(--notes-file RELEASE_NOTES.md); else NOTES+=(--generate-notes); fi
          gh release create "$TAG" release-artifacts/* --target "$GITHUB_SHA" --title "$TAG" --draft "${FLAGS[@]}" "${NOTES[@]}"
          gh release edit "$TAG" --draft=false
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${KEYSTORE_PATH:-}" && -f "$KEYSTORE_PATH" ]]; then rm -f -- "$KEYSTORE_PATH"; fi
